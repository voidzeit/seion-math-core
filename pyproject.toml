[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seion-math-core"
version = "0.1.0"
description = "Typed finite-dimensional verification tools for Kernel-Integrated N-ary Laws"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "SEION Mathematical Verification Contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
research = ["torch>=2.0", "mpmath>=1.3", "matplotlib>=3.7"]

[project.scripts]
seion-core = "seion_core.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: extended numerical experiments",
  "gpu: optional accelerator test",
  "symbolic: symbolic algebra checks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

