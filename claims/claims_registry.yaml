claims:
  - id: DEF_NARY_LAW_V1
    title: Typed finite-dimensional n-ary law
    status: definition
    statement: "A structural tensor K of shape (d_out,d_1,...,d_n) defines an n-linear map with explicit input and output dimensions."
    assumptions: [finite-dimensional coordinate spaces, numeric field]
    evidence: [src/seion_core/algebra/nary_law.py, tests/unit/test_nary_law.py]
  - id: DEF_ASSOCIATOR_CONVENTIONS_V1
    title: Distinct ternary composition conventions
    status: definition
    statement: "The five-input, anchored binary, and operadic partial-composition objects are represented by separate functions and recorded conventions."
    assumptions: [ternary arity for specialized formulas]
    evidence: [src/seion_core/algebra/ternary_law.py, tests/unit/test_associators.py]
  - id: THM_STANDARD_CURVATURE_ASSOCIATOR_DIFFERENCE_V1
    title: Standard left-action curvature expansion
    status: proved
    statement: "For any bilinear product, [L_x,L_y]-L_[x,y] applied to z equals A(y,x,z)-A(x,y,z), with [x,y]=x circ y-y circ x."
    assumptions: [finite-dimensional bilinear product, stated commutator convention]
    proof: docs/theorems/curvature_associator.md
    symbolic_checks: [artifacts/symbolic/curvature_identity.json]
    counterexamples: [docs/counterexamples/curvature_without_symmetry.md]
  - id: THM_COHOMOLOGY_DESCENT_FINITE_V1
    title: Commuting finite operator descends to cohomology
    status: proved_under_assumptions
    statement: "If a finite operator commutes with the differential, it preserves cycles and boundaries and therefore induces a map on the quotient cohomology space."
    assumptions: [d squared equals zero, same-degree linear operator, exact commutation]
    proof: docs/theorems/cohomology_descent.md
    numerical_checks: [tests/unit/test_cohomology.py]
  - id: NUM_KNOWN_INVARIANT_CLOSURE_V1
    title: Known block subspace closure
    status: numerically_verified
    statement: "For the declared block-supported example, the coordinate projector has zero closure leakage up to floating-point evaluation."
    assumptions: [example definition, finite samples, float64]
    evidence: [experiments/configs/finite_ternary_v1.yaml]
  - id: EMP_PROJECTOR_RECOVERY_V1
    title: Empirical closure-minimizing recovery
    status: empirical
    statement: "A small stochastic Stiefel search can reduce sampled closure leakage on some declared examples; no general recovery or superiority claim is made."
    assumptions: [seed, sample distribution, optimizer steps]
    evidence: [src/seion_core/variational/optimizers.py]
  - id: CONJ_CONTINUUM_LIMIT_V1
    title: Uniform continuum limit for kernel-integrated laws
    status: open
    statement: "A sequence of finite laws may converge in a specified topology under uniform estimates; this repository does not prove a general theorem."
    assumptions: [resolution sequence, topology, uniform bounds, compactness or convergence argument]
    evidence: [docs/open_problems/index.md]
  - id: REFUTED_SNAPPING_NO_GAP_V1
    title: Continuity of spectral snapping without a gap
    status: refuted
    statement: "Threshold snapping is not continuous when eigenvalues may cross the threshold."
    assumptions: [no uniform spectral gap]
    evidence: [src/seion_core/projectors/snapping.py, tests/numerical/test_snapping.py]

  - id: EMP_ATN_FO_PARETO_M8_M10_V1
    title: Measured first order dominates immediate pairwise and step-greedy policies in the exact small terminal landscapes
    status: empirical
    statement: "For the five executed heterogeneous D=16 chain instances at each of m=8 and m=10, measured first order has both lower mean exact-terminal regret and fewer forward evaluations than full pairwise, low-rank pairwise q4, and exhaustive step-greedy under the same rank trajectory."
    assumptions: [frozen projector bases, six rounds, three rank additions per round, exact terminal enumeration, recorded evaluation accounting]
    evidence: [applications/adaptive_tensor_network/results/policy_scaling_m8.json, applications/adaptive_tensor_network/results/policy_scaling_m10.json, applications/adaptive_tensor_network/results/engineering_pareto_front.csv, applications/adaptive_tensor_network/ENGINEERING_ADVANTAGE_REGISTER.md]

  - id: EMP_ATN_ROLLOUT_TRADEOFF_M8_M10_V1
    title: Full-horizon rollout exchanges much higher evaluation cost for lower exact-terminal regret
    status: empirical
    statement: "In the executed m=8 and m=10 exact terminal landscapes, first-order-base horizon-6 rollout lowers mean terminal regret relative to measured first order while consuming two to three orders of magnitude more objective evaluations; neither policy dominates the other in error versus evaluation cost."
    assumptions: [heterogeneous D=16 chains, five seeds per size, fixed first-order continuation, exact terminal enumeration]
    evidence: [applications/adaptive_tensor_network/results/rollout_calibration_m8_raw.json, applications/adaptive_tensor_network/results/rollout_calibration_m10_raw.json, applications/adaptive_tensor_network/results/HORIZON_SCALING_M38_FINDINGS.md, applications/adaptive_tensor_network/results/engineering_pareto_front.csv]

  - id: REFUTED_ATN_PATHWISE_GENERAL_SUPERIORITY_V1
    title: General equal-rank superiority of pathwise allocation
    status: refuted
    statement: "The preregistered hypothesis that pathwise_global lowers true root error against the best of uniform, singular-energy, and local-error-greedy allocation at equal total rank is contradicted in the registered Level 1 synthetic campaign."
    assumptions: [Level 1 preregistration, two declared topologies, ten seeds, equal rank budgets]
    evidence: [applications/adaptive_tensor_network/experiments/PREREGISTRATION.md, applications/adaptive_tensor_network/results/level1_analysis.json, applications/adaptive_tensor_network/results/APPLIED_VALIDATION_STATUS_2026-08-09.md]

  - id: REFUTED_ATN_CERTIFICATE_ACTION_RANKING_M36_V1
    title: M24/M25 certificate deltas as useful action-ranking surrogates
    status: refuted
    statement: "Across the 15 executed M36 states, none of the scalar, restricted, or Gram-aware certificate deltas selected the true best action; tighter certification did not improve action ranking."
    assumptions: [m=8, heterogeneous synthetic regime, 56 candidate bundles per state, three states per seed, five seeds]
    evidence: [applications/adaptive_tensor_network/results/certificate_alignment_raw.json, applications/adaptive_tensor_network/results/m36_analysis.json, applications/adaptive_tensor_network/results/CERTIFICATE_ALIGNMENT_M36_FINDINGS.md]

  - id: EMP_ATN_REFF_QDEC_ASSOCIATION_M37_V1
    title: Effective interaction rank is associated with per-instance decision-rank requirement
    status: empirical
    statement: "In the executed M37 synthetic configurations, participation-ratio effective rank has Spearman association 0.710, 0.776, and 0.749 with q_dec95 at D=8, D=16, and D=32; no held-out capacity-planning advantage is claimed."
    assumptions: [M37 family design, per-configuration decision-aware rank definition, synthetic networks]
    evidence: [applications/adaptive_tensor_network/results/m37_decision_rank.csv, applications/adaptive_tensor_network/results/HETEROGENEITY_MECHANISM_M37_FINDINGS.md]

  - id: OPEN_ATN_THRESHOLD_COMPETITOR_V1
    title: Downstream-aware allocation versus standard static and adaptive truncation thresholds
    status: superseded
    statement: "This missing-baseline question was resolved by ATN_THRESHOLD_GATE_V1 and its predeclared fixed-size V1B precision extension; see EMP_ATN_FO_THRESHOLD_REGIME_SPLIT_V1."
    assumptions: [matched rank, memory, evaluation, and wall-clock budgets required]
    evidence: [experiments/configs/ATN_THRESHOLD_GATE_V1.yaml, experiments/configs/ATN_THRESHOLD_GATE_V1B.yaml, applications/adaptive_tensor_network/results/THRESHOLD_GATE_V1B_FINDINGS.md, applications/adaptive_tensor_network/ENGINEERING_ADVANTAGE_REGISTER.md]

  - id: EMP_ATN_FO_THRESHOLD_REGIME_SPLIT_V1
    title: Measured first order has a regime-limited terminal advantage over truncation thresholds
    status: empirical
    statement: "In the pooled identical-design synthetic exact-terminal sample of 35 seeds, measured first order does not separate from static or adaptive threshold at m=8, while at m=10 it has lower mean normalized terminal error than both thresholds with paired bootstrap intervals above zero. Threshold remains much cheaper in forward evaluations, so no general Pareto dominance or universal FO advantage is established."
    assumptions: [frozen projector bases, heterogeneous D=16 chains, six rounds, three rank additions per round, equal terminal rank, exact terminal objective, V1B declared after V1 and before its new seeds, pooled analysis descriptive]
    evidence: [experiments/configs/ATN_THRESHOLD_GATE_V1.yaml, experiments/configs/ATN_THRESHOLD_GATE_V1B.yaml, applications/adaptive_tensor_network/results/threshold_gate_m8_m10_raw.json, applications/adaptive_tensor_network/results/threshold_gate_v1b_raw.json, applications/adaptive_tensor_network/results/threshold_gate_v1b_summary.json, applications/adaptive_tensor_network/results/THRESHOLD_GATE_V1B_FINDINGS.md]
