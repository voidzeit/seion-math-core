  - id: THM_V5_K3_M11_CONDITIONAL_QUANTITATIVE_GAP
    title: Conditional quantitative k=3 gap below M9 under first-propagator saturation
    statement: >-
      For the ordered k=3 chain, under exact operator-norm saturation of the
      first propagated-defect direction at the second node, the normalized
      projected error is at most G(eta)/eta, where G(eta)=eta*sqrt(4-3 eta^2)
      for eta<=sqrt(2/3) and G(eta)=2/sqrt(3) thereafter. This is a
      quantitative conditional gap and is not an unconditional replacement
      for the M9 envelope.
    scope:
      - finite-dimensional real or complex Hilbert spaces
      - ordered binary k=3 chain
      - orthogonal projectors and independent node laws
      - first propagated-defect norm saturation at the second node
      - 0 < eta <= 1
    dependencies:
      - THM_V5_K3_GENERAL_UPPER_ENVELOPE
      - THM_V5_K3_UPPER_ENVELOPE_NOT_ATTAINED
    proof_location: research/math_closure/k3/m11_conditional_quantitative_gap.tex
