  - id: THM_V5_EXACT_NONNEGATIVE_DAG_PATH_CONSTANT
    title: Exact path constant for the nonnegative first-order DAG channel class
    statement: >-
      For every finite acyclic DAG with nonnegative edge gains and bounded
      nonnegative local source amplitudes, the root value of the channel
      recurrence d_v=s_v+sum_e g_e d_source(e) equals the sum of source bounds
      weighted by the total product of gains over all source-to-root paths.
      The constant is attained by setting every source to its bound, including
      shared subexpressions and parallel edges representing repeated slots.
      When instantiated by multilinear telescoping enclosures this proves
      sharpness of the first-order nonnegative envelope, not automatically of
      the full multilinear operator class.
    scope:
      - finite acyclic nonnegative first-order channel DAGs
      - finite local source bounds and nonnegative edge gains
      - shared subexpressions and repeated input slots
    dependencies:
      - THM_V5_FINITE_DAG_DOMAIN_ERROR_CERTIFICATE
    proof_location: research/math_closure/dag/exact_path_constant.tex
    implementation: src/seion_core/research_v5/dag_path_constant.py
    tests: [tests/research_v5_test_dag_path_constant.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: EXACT_FOR_DECLARED_NONNEGATIVE_CHANNEL_CLASS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_SHARED_DIAMOND_DAG_ASYMPTOTIC_SHARPNESS
    title: Exact asymptotic path constant for the independent-law shared diamond DAG
    statement: >-
      For the binary shared diamond DAG with one shared projected node, two
      projected branches, an unprojected root, unit leaves, orthogonal
      rank-one real projection, operator norm at most one, and uniform normal
      defect cap eta, the normalized asymptotic constant is exactly 4. The
      universal path recurrence gives E <= 4 eta, while the planar independent
      law mu_theta(z,w)=exp(i theta) z w with theta=arcsin(eta) has exact error
      |exp(4 i theta)-cos(theta)^4| and ratio tending to 4 as eta decreases
      to zero.
    scope:
      - finite-dimensional real Hilbert spaces identified with the complex plane
      - fixed shared diamond DAG topology
      - independently selectable binary laws
      - unit leaves, rank-one real projection, and unprojected root
      - asymptotic eta downarrow 0 only
    dependencies:
      - THM_V5_EXACT_NONNEGATIVE_DAG_PATH_CONSTANT
      - THM_V5_FINITE_DAG_DOMAIN_ERROR_CERTIFICATE
    proof_location: research/math_closure/dag/diamond_asymptotic_sharpness.tex
    implementation: research/math_closure/dag/diamond_asymptotic_sharpness.py
    tests: [tests/math_closure/test_diamond_asymptotic_sharpness.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: EXACT_ASYMPTOTIC_SHARED_DIAMOND_CONSTANT
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_FIXED_DAG_INDEPENDENT_ASYMPTOTIC_PATH_SHARPNESS
    title: Asymptotic path sharpness for every fixed independent-law multilinear DAG
    statement: >-
      For every fixed finite ordered acyclic multilinear DAG with unit leaves,
      rank-one real projection at every non-root internal node, unprojected
      root, independent binary or finite-arity node laws of norm at most one,
      and normal operator defect cap eta, the normalized asymptotic constant as
      eta decreases to zero equals K(G), the sum over projected nodes of their
      directed slot-path multiplicities to the root. The upper bound follows
      from the nonnegative path recurrence. The planar laws
      mu_theta(z_1,...,z_m)=exp(i theta) prod_j z_j with theta=arcsin(eta)
      attain the limit, with exact witness error
      |exp(i K(G) theta)-cos(theta)^K(G)|.
    scope:
      - fixed finite ordered acyclic DAGs with internal arities at least one
      - finite-dimensional real Hilbert spaces identified with the complex plane
      - independent node laws, unit leaves, rank-one real projections
      - unprojected root and asymptotic eta downarrow 0
    dependencies:
      - THM_V5_EXACT_NONNEGATIVE_DAG_PATH_CONSTANT
      - THM_V5_FINITE_DAG_DOMAIN_ERROR_CERTIFICATE
    proof_location: research/math_closure/dag/dag_asymptotic_sharpness.tex
    implementation: src/seion_core/research_v5/dag_asymptotic_sharpness.py
    tests: [tests/research_v5_test_dag_asymptotic_sharpness.py, applications/adaptive_tensor_network/tests/test_dag_asymptotic_witness.py]
