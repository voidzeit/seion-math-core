  - id: THM_V5_FINITE_DAG_DOMAIN_ERROR_CERTIFICATE
    title: Finite multilinear DAG bounded-domain error certificate with shared subexpressions
    statement: >-
      For every finite acyclic multilinear DAG with declared nonnegative
      operator enclosures M_v, rank-indexed normal-residual enclosures rho_v,
      and bounded leaf domains, the topological recurrence
      U_v <= M_v prod_i U_i and D_v <= rho_v(r_v) prod_i U_i +
      M_v sum_i(prod_{j != i} U_j)D_i certifies the root error. Shared
      subexpressions are computed once and charged once per input slot and
      downstream fan-out edge. With rank-independent M_v and U_v, reverse
      downstream gains make the finite integer rank-budget objective separable,
      so the returned knapsack dynamic program is exact for this enclosure
      model.
    scope:
      - finite-dimensional multilinear DAGs represented by finite nonnegative enclosures
      - acyclic graphs with repeated input slots and shared subexpressions
      - bounded leaf domains and finite rank tables
      - unprojected root by default, with optional projected-root extension
    dependencies: []
    proof_location: research/math_closure/dag/global_domain_certificate.tex
    implementation: src/seion_core/research_v5/dag_domain_certificate.py
    tests: [tests/research_v5_test_dag_domain_certificate.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: FINITE_DAG_CERTIFICATE_NOT_EXTREMAL
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_FINITE_DAG_RANK_AWARE_DOMAIN_CERTIFICATE
    title: Rank-aware bounded-domain certificate for fixed finite DAG allocations
    statement: >-
      For every finite acyclic multilinear DAG with declared exact-value
      bounds M_v, rank-dependent projected-operator bounds L_v(r), normal
      residual bounds rho_v(r), and bounded leaf domains, a fixed rank
      assignment is certified by U_v <= M_v prod_i U_i,
      A_v <= L_v(r_v) prod_i A_i, and D_v <= rho_v(r_v) prod_i A_i +
      L_v(r_v) sum_i(prod_{j != i} max(U_j,A_j))D_i, with the root local
      term omitted when unprojected. The recurrence is valid for shared
      subexpressions and repeated input slots. Rank choices are generally
      coupled; exhaustive optimization is therefore scoped to small finite
      DAGs and does not imply a scalable allocation theorem.
    scope:
      - finite-dimensional multilinear DAGs with finite rank tables
      - fixed rank assignments on bounded leaf domains
      - shared subexpressions and repeated input slots
      - unprojected root by default
    dependencies:
      - THM_V5_FINITE_DAG_DOMAIN_ERROR_CERTIFICATE
