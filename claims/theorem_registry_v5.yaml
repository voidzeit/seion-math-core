  - id: THM_V5_K3_RANK_ONE_SAME_LAW_CHAIN_OPERATOR_REDUCTION
    title: Exact unary-operator reduction for the rank-one/common-leaf same-law chain
    statement: >-
      For the strict binary k=3 chain with one repeated real bilinear law,
      common unit projected leaf e0, and rank-one projector P=span(e0), the
      projected error is exactly |<e0,A^3 e0>-<e0,A e0>^3|, where
      A(x)=mu(x,e0), under ||mu||_op<=M and the evaluated projected-input
      closure cap ||Q mu(e0,e0)||<=rho=eta*M. Conversely every
      finite-dimensional contraction A is realized by the gated repeated law
      mu_A(x,y)=A x <e0,y>, preserving both the operator and closure caps.
      Hence the class extremum is exactly the corresponding
      contraction-operator supremum with ||Q A e0||<=eta after normalization
      M=1.
    scope:
      - finite-dimensional real binary k=3 chain
      - one repeated bilinear law at all internal nodes
      - common unit projected leaf e0
      - rank-one orthogonal projector span(e0)
      - 0 < eta <= 1
