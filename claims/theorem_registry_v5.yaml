version: 5
track: projected_graphs_v5
governance_note: >-
  V5 theorem entries are scoped to their declared finite-dimensional classes.
  Independent human review and theorem-level novelty review remain pending.
theorems:
  - id: THM_V5_K2_INDEPENDENT_LAW_PROJECTED_SHARPNESS
    title: Exact k=2 projected-root sharpness for independent binary laws
    statement: >-
      For the real binary k=2 chain with independent node laws, an orthogonal
      rank-one projector, unit leaves, uniform operator norm M, and closure
      ratio eta=rho/M in (0,1], the projected-root constant satisfies
      C_2^P(eta)=1. An explicit two-dimensional construction attains
      E_proj=rho M.
    scope:
      - finite-dimensional real Hilbert spaces
      - binary chain with two independently chosen bilinear laws
      - orthogonal rank-one projector
      - unit leaf norms
      - uniform M and rho
      - 0 < eta <= 1
    dependencies:
      - THM_V3_PROJECTED_ROOT_K_MINUS_ONE
    proof_location: research/projected_trees_v5/extremal/K2_EQUALITY_AND_SATURATION.md
    implementation: src/seion_core/research_v5/k2_sharpness.py
    tests:
      - tests/research_v5_test_k2_sharpness.py
      - tests/research_v5_test_equality_conditions.py
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: EXACT_FOR_DECLARED_INDEPENDENT_LAW_CLASS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_K2_EQUALITY_COMPATIBILITY_INDEPENDENT_LAWS
    title: Equality-condition compatibility for the independent-law construction
    statement: >-
      The operator-norm, closure, propagated-normal-error, and projected-root
      equality requirements for the k=2 projected bound are simultaneously
      compatible when the inner and outer laws may be chosen independently.
    scope:
      - same finite-dimensional real binary-chain class as THM_V5_K2_INDEPENDENT_LAW_PROJECTED_SHARPNESS
    dependencies:
      - THM_V5_K2_INDEPENDENT_LAW_PROJECTED_SHARPNESS
    proof_location: research/projected_trees_v5/extremal/K2_EQUALITY_AND_SATURATION.md
    implementation: src/seion_core/research_v5/equality_conditions.py
    tests: [tests/research_v5_test_equality_conditions.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: OPEN_V5_K2_REPEATED_LAW_SHARPNESS
    title: Fixed-eta k=2 sharpness for the gated-planar repeated-law subclass
    statement: >-
      It remains open whether the earlier gated-planar repeated-law subclass
      can attain its ambient same-law upper bound at fixed eta.
    scope: [gated-planar repeated/shared node law, fixed eta]
    epistemic_status: OPEN
    novelty_status: NOVELTY_NOT_ESTABLISHED
  - id: THM_V5_K2_SAME_LAW_PROJECTED_SHARPNESS
    title: Exact k=2 projected-root sharpness for an explicitly repeated bilinear law
    statement: >-
      For the real binary k=2 chain with one bilinear law reused at both
      internal nodes, an orthogonal rank-one projector, unit leaves, uniform
      operator norm M, and rho=eta*M in (0,1], the explicitly declared same-law
      class has C_2^P(eta)=1. The map mu(x,y)=M*x1*y0*e0+rho*x0*y0*e1 attains
      E_proj=rho*M.
    scope:
      - finite-dimensional real Hilbert spaces
      - binary chain with one repeated bilinear law
      - orthogonal rank-one projector
      - unit leaf norms
      - 0 < eta <= 1
    dependencies:
      - THM_V3_PROJECTED_ROOT_K_MINUS_ONE
    proof_location: research/projected_trees_v5/extremal/V5B_EXTREMAL_STATUS.md
    implementation: src/seion_core/research_v5/k2_sharpness.py
    tests: [tests/research_v5_test_k2_sharpness.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: EXACT_FOR_DECLARED_SAME_LAW_CLASS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: LB_V5_K3_INDEPENDENT_CHAIN
    title: Independent-law k=3 chain lower construction
    statement: >-
      For the declared rank-one real binary chain witness with independent
      bilinear laws and defect budget rho=eta*M, E_proj equals
      2*M*q*sqrt(M^2-q^2), where q=min(rho,M/sqrt(2)).
    scope: [finite real binary chain, independent laws, rank-one orthogonal projector]
    proof_location: research/projected_trees_v5/truth_ledger/PROJECTED_GRAPHS_V5_TRUTH_LEDGER.md
    implementation: src/seion_core/research_v5/k3_independent_candidates.py
    tests: [tests/research_v5_test_k3_independent_candidates.py]
    epistemic_status: CERTIFIED_LOWER_BOUND
    sharpness_status: GLOBAL_SHARPNESS_OPEN
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: LB_V5_K3_PIECEWISE_SCALAR_CURVE
    title: Piecewise V5-A lower curve from the exact scalar optimizer
    statement: >-
      For the declared V5-A independent-law k=3 witness family, optimizing
      2*M*q*sqrt(M^2-q^2) over 0 <= q <= rho=eta*M gives the normalized lower
      curve L_3(eta)=2*sqrt(1-eta^2) for eta <= 1/sqrt(2), and L_3(eta)=1/eta
      for eta > 1/sqrt(2).
    scope:
      - finite real binary k=3 witness family
      - independently chosen bilinear laws
      - rank-one orthogonal projector
      - 0 < eta <= 1
    dependencies:
      - LB_V5_K3_INDEPENDENT_CHAIN
      - LB_V5_K3_INDEPENDENT_BRANCH
    proof_location: research/projected_trees_v5/extremal/V5B_EXTREMAL_STATUS.md
    implementation: src/seion_core/research_v5/v5b_extremal.py
    tests: [tests/research_v5_test_v5b_extremal.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: CERTIFIED_LOWER_BOUND_ONLY
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_K3_ASYMPTOTIC_SHARPNESS_INDEPENDENT
    title: Asymptotic k=3 sharpness as eta tends to zero
    statement: >-
      For the declared independent-law k=3 class covered by the V5-A witness
      and the universal projected-root bound, lim_{eta downarrow 0}
      C_{3,ind}^P(eta)=2. The lower limit follows from the V5-A curve and the
      upper limit from the universal k-1 bound.
    scope:
      - finite real binary k=3 independent-law class covered by V5-A
      - 0 < eta <= 1
      - asymptotic eta -> 0 only
    dependencies:
      - THM_V3_PROJECTED_ROOT_K_MINUS_ONE
      - LB_V5_K3_PIECEWISE_SCALAR_CURVE
    proof_location: research/projected_trees_v5/extremal/V5B_EXTREMAL_STATUS.md
    implementation: src/seion_core/research_v5/v5b_extremal.py
    tests: [tests/research_v5_test_v5b_extremal.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: ASYMPTOTIC_ONLY_FIXED_ETA_OPEN
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: LB_V5_K3_INDEPENDENT_BRANCH
    title: Independent-law k=3 branching lower construction
    statement: >-
      A separate declared rank-one real binary branching witness with
      independent bilinear laws attains the same certified lower-bound value
      as the V5-A chain witness.
    scope: [finite real binary branching, independent laws, rank-one orthogonal projector]
    proof_location: research/projected_trees_v5/truth_ledger/PROJECTED_GRAPHS_V5_TRUTH_LEDGER.md
    implementation: src/seion_core/research_v5/k3_independent_candidates.py
    tests: [tests/research_v5_test_k3_independent_candidates.py]
    epistemic_status: CERTIFIED_LOWER_BOUND
    sharpness_status: GLOBAL_SHARPNESS_OPEN
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: CONJ_V5_INDEPENDENT_TREE_SHARPNESS
    title: Independent-law finite-tree sharpness conjecture
    statement: >-
      For sufficiently free independent laws, C_T,ind^P(eta) may equal
      k(T)-1 for finite trees; this remains a conjecture and is not a theorem.
    scope: [finite projected multilinear trees, independent laws]
    epistemic_status: OPEN
    novelty_status: NOVELTY_NOT_ESTABLISHED
  - id: THM_V5_K2_SATURATION_IFF_CHARACTERIZATION
    title: Necessary-and-sufficient characterization of k=2 saturation
    statement: >-
      For a binary k=2 chain (arbitrary finite dimension, arbitrary
      orthogonal-projector rank, laws independent or repeated), writing
      D=(I-P)mu_in(a,b), the configuration attains E_proj=rho*M*L_T exactly
      iff EQ1 (mu_out saturates M on (D,d)), EQ2 (the closure map (I-P)mu_in
      saturates rho on (a,b)), and EQ3 (mu_out(D,d) already lies in
      Range(P_out)) hold simultaneously. Proved by an elementary chain-of-
      inequalities argument; both known k=2 witnesses verified as instances,
      and a third, independently constructed instance predicted and
      verified to saturate.
    scope:
      - finite-dimensional real or complex Hilbert spaces
      - binary k=2 chain, arbitrary ambient dimension and projector rank
      - independent or repeated bilinear laws
      - 0 < eta <= 1
    dependencies:
      - THM_V5_K2_INDEPENDENT_LAW_PROJECTED_SHARPNESS
      - THM_V5_K2_SAME_LAW_PROJECTED_SHARPNESS
    proof_location: research/math_closure/k2/saturation_iff_theorem.tex
    implementation: src/seion_core/research_v5/k2_characterization.py
    tests: [tests/research_v5_test_k2_characterization.py]
    epistemic_status: PROVED
    sharpness_status: COMPLETE_IFF_CHARACTERIZATION_FOR_DECLARED_CLASS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_K3_GENERAL_UPPER_ENVELOPE
    title: Unconditional tightened k=3 upper bound for chain and branching topologies
    statement: >-
      For the independent-law k=3 chain and branching classes (arbitrary
      finite dimension, arbitrary projector rank, no rank-one restriction),
      C_3,ind^P(eta) <= U_3(eta), where U_3(eta)=1+sqrt(1-eta^2) for
      0<eta<=eta_star and sqrt(1+eta^2)/eta for eta_star<eta<=1, with
      eta_star=sqrt((sqrt5-1)/2). U_3(eta)<2 strictly for every eta>0 and
      U_3(1)=sqrt(2), a 29% reduction from the trivial universal bound.
      Derived from exact local-error telescoping plus a Pythagorean
      coupling between the two propagated-error terms at the first internal
      node; identical bound for both topologies.
    scope:
      - finite-dimensional real or complex Hilbert spaces
      - binary k=3 chain and branching trees, arbitrary dimension/rank
      - independently chosen bilinear laws bounded by M, closure residual <= rho
      - 0 < eta <= 1
    dependencies:
      - THM_V3_PROJECTED_ROOT_K_MINUS_ONE
      - LB_V5_K3_PIECEWISE_SCALAR_CURVE
    proof_location: research/math_closure/k3/general_upper_envelope.tex
    implementation: src/seion_core/research_v5/k3_upper_bound.py
    tests: [tests/research_v5_test_k3_upper_bound.py]
    epistemic_status: PROVED
    sharpness_status: CERTIFIED_UPPER_BOUND_GAP_NARROWED_NOT_CLOSED
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
    supersedes: >-
      The CONDITIONAL_ON_UNPROVED_SCALAR_REDUCTION bookkeeping entry in
      src/seion_core/research_v5/v5b_extremal.py (conditional_scalar_reduction_upper_bound),
      whose assumptions were never proved and were dimensionally
      inconsistent with the actual witness value.
  - id: THM_V5_K3_UPPER_ENVELOPE_NOT_ATTAINED
    title: M9's upper envelope U_3(eta) is not attained (M10, revised)
    statement: >-
      For the k=3 chain (and branching) class, no single admissible
      configuration attains E_proj=U_3(eta)*rho*M^2*L_T exactly. Proved
      via a projector-independent repair of the original argument: (node
      2) if T1 saturates exactly, a self-adjointness/contradiction
      argument (valid for ANY orthogonal projector P2, not a specifically
      constructed one) shows S2 is never a nonzero scalar multiple of S1;
      (node 3) decomposing S2 relative to S1's direction and applying the
      base lemma to the orthogonal remainder shows requiring BOTH
      triangle-inequality parallelism AND exact T2 saturation at the root
      forces that remainder to vanish, contradicting the node-2 result.
    NOT_established: >-
      This does NOT prove C_3,ind^P(eta) < U_3(eta) as a strict supremum
      inequality (an error in the original version of this entry) --
      non-attainment at every point is consistent with the supremum still
      equalling U_3(eta) in a limit. The strict inequality is a separate,
      open question (see OPEN_V5_K3_STRICT_SUPREMUM_GAP below).
    revision_note: >-
      Revised after review found two errors in the first version: an
      unjustified "S1 perp S2" claim (repaired above) and an invalid
      inference from non-attainment to a strict supremum gap (removed;
      epistemic_status downgraded PROVED -> PROVED_NON_ATTAINMENT).
    scope:
      - same class as THM_V5_K3_GENERAL_UPPER_ENVELOPE
      - 0 < eta < 1
    dependencies:
      - THM_V5_K3_GENERAL_UPPER_ENVELOPE
    proof_location: research/math_closure/k3/m10_non_sharpness_of_m9.tex
    implementation: src/seion_core/research_v5/k3_non_sharpness.py
    tests: [tests/research_v5_test_k3_non_sharpness.py]
    epistemic_status: PROVED_NON_ATTAINMENT
    sharpness_status: PROVES_NON_ATTAINMENT_ONLY_NO_STRICT_GAP_NO_TIGHTENED_VALUE
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: OPEN_V5_K3_STRICT_SUPREMUM_GAP
    title: Whether C_3,ind^P(eta) is strictly below U_3(eta) (as a supremum, not just unattained)
    statement: >-
      THM_V5_K3_UPPER_ENVELOPE_NOT_ATTAINED proves no single configuration
      reaches U_3(eta), but this does not by itself establish
      C_3,ind^P(eta) < U_3(eta): the supremum could still equal U_3(eta),
      approached by a sequence of configurations without any one attaining
      it. Closing this needs either (Route A) a compactness argument
      restricting to a class where the extremal problem is known to live
      on a compact set -- blocked on the still-open dimension/rank
      reduction result -- or (Route B) an explicit quantitative gap
      E_proj <= U_3(eta) - delta(eta), delta(eta) > 0, unconditionally.
      pareto_frontier_two_direction_norm_budget quantifies the underlying
      trade-off Route B would need but does not solve the resulting joint
      (magnitude, angle) optimization.
    scope: [independent-law k=3 chain and branching, 0 < eta < 1]
    dependencies:
      - THM_V5_K3_UPPER_ENVELOPE_NOT_ATTAINED
    epistemic_status: OPEN
    novelty_status: NOVELTY_NOT_ESTABLISHED
  - id: OPEN_V5_K3_FIXED_ETA_SHARPNESS
    title: Fixed-eta k=3 sharpness (gap narrowed via M9; whether it strictly excludes U_3 remains open)
    statement: >-
      L_3(eta) <= C_3,ind^P(eta) <= U_3(eta) < 2 for every eta in (0,1);
      the certified gap narrowed substantially via
      THM_V5_K3_GENERAL_UPPER_ENVELOPE (e.g. at eta=1, relative gap
      50%->29%). THM_V5_K3_UPPER_ENVELOPE_NOT_ATTAINED further proves no
      single configuration reaches U_3(eta) exactly, but whether the
      supremum itself is strictly below U_3(eta) is a separate open
      question (OPEN_V5_K3_STRICT_SUPREMUM_GAP) -- no exact tightened
      value or matching construction is known either way. The precise
      open problem is now a well-posed joint optimization over the
      magnitude allocation q and the angle between the two propagated-
      error terms, not a vague "improve the bound" question.
    scope: [independent-law k=3 chain and branching, 0 < eta <= 1]
    dependencies:
      - LB_V5_K3_PIECEWISE_SCALAR_CURVE
      - THM_V5_K3_GENERAL_UPPER_ENVELOPE
      - THM_V5_K3_UPPER_ENVELOPE_NOT_ATTAINED
      - OPEN_V5_K3_STRICT_SUPREMUM_GAP
    epistemic_status: OPEN_WITH_CERTIFIED_GAP
    novelty_status: NOVELTY_NOT_ESTABLISHED
  - id: OPEN_V5_DIMENSION_RANK_REDUCTION
    title: Universal dimension/rank reduction for projected sharpness
    statement: >-
      It remains open whether the relevant projected sharpness supremum can be
      reduced to a finite universal ambient dimension and projector rank.
    scope: [general projected multilinear trees]
    epistemic_status: OPEN
    novelty_status: NOVELTY_NOT_ESTABLISHED
