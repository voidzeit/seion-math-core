  - id: THM_V5_K2_CLASS_A_EXACT_CONSTANT
    title: Exact normalized k=2 constant for the declared general binary class
    statement: >-
      For the declared finite-dimensional real binary-chain class with
      arbitrary bounded bilinear laws (shared or independent), orthogonal
      proper projectors, unit leaves, uniform M and rho=eta*M, the class-level
      projected-root constant is C_2^P(eta;A)=1 for every 0<eta<=1. The
      universal k-1 upper bound and the explicit repeated-law rank-two witness
      give matching upper and lower bounds.
    scope:
      - finite-dimensional real Hilbert spaces
      - binary k=2 chain
      - arbitrary bounded bilinear laws, shared or independent
      - orthogonal proper projectors and unit leaves
      - 0 < eta <= 1
