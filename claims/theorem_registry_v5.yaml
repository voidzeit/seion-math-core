  - id: THM_V5_K2_GATED_PLANAR_ROTATION_EXACT_VALUE
    title: Exact k=2 value for the declared gated-planar rotation construction
    statement: >-
      For the homogeneous binary k=2 chain using the declared gated-planar
      rotation law at both nodes, unit leaves, a coordinate orthogonal
      projector of any nontrivial rank, and 0<=eta<=1, the projected error is
      exactly E_proj=eta^2. Its ratio to the universal projected-root bound is
      eta, so it saturates that bound if and only if eta=1.
    scope:
      - finite-dimensional real Hilbert spaces
      - homogeneous binary k=2 chain
      - declared gated-planar rotation law
      - coordinate orthogonal projector with 1 <= rank < dimension
      - unit leaf inputs
      - 0 <= eta <= 1
