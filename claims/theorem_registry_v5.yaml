version: 5
track: projected_graphs_v5
governance_note: >-
  V5 theorem entries are scoped to their declared finite-dimensional classes.
  Independent human review and theorem-level novelty review remain pending.
theorems:
  - id: THM_V5_K2_INDEPENDENT_LAW_PROJECTED_SHARPNESS
    title: Exact k=2 projected-root sharpness for independent binary laws
    statement: >-
      For the real binary k=2 chain with independent node laws, an orthogonal
      rank-one projector, unit leaves, uniform operator norm M, and closure
      ratio eta=rho/M in (0,1], the projected-root constant satisfies
      C_2^P(eta)=1. An explicit two-dimensional construction attains
      E_proj=rho M.
    scope:
      - finite-dimensional real Hilbert spaces
      - binary chain with two independently chosen bilinear laws
      - orthogonal rank-one projector
      - unit leaf norms
      - uniform M and rho
      - 0 < eta <= 1
    dependencies:
      - THM_V3_PROJECTED_ROOT_K_MINUS_ONE
    proof_location: research/projected_trees_v5/extremal/K2_EQUALITY_AND_SATURATION.md
    implementation: src/seion_core/research_v5/k2_sharpness.py
    tests:
      - tests/research_v5_test_k2_sharpness.py
      - tests/research_v5_test_equality_conditions.py
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: EXACT_FOR_DECLARED_INDEPENDENT_LAW_CLASS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_K2_EQUALITY_COMPATIBILITY_INDEPENDENT_LAWS
    title: Equality-condition compatibility for the independent-law construction
    statement: >-
      The operator-norm, closure, propagated-normal-error, and projected-root
      equality requirements for the k=2 projected bound are simultaneously
      compatible when the inner and outer laws may be chosen independently.
    scope:
      - same finite-dimensional real binary-chain class as THM_V5_K2_INDEPENDENT_LAW_PROJECTED_SHARPNESS
    dependencies:
      - THM_V5_K2_INDEPENDENT_LAW_PROJECTED_SHARPNESS
    proof_location: research/projected_trees_v5/extremal/K2_EQUALITY_AND_SATURATION.md
    implementation: src/seion_core/research_v5/equality_conditions.py
    tests: [tests/research_v5_test_equality_conditions.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: OPEN_V5_K2_REPEATED_LAW_SHARPNESS
    title: Unresolved variants of broader gated-planar repeated-law sharpness
    statement: >-
      The phrase broader gated-planar repeated-law is not unique without a
      definition of the gate, active operator, leaf directions, and ambient
      support. The canonical contractive gated-planar subclass defined in M17
      is now closed at value 1; variants with variable gates, arbitrary leaf
      directions, or non-planar shared laws remain unresolved.
    scope: [unresolved gated-planar repeated/shared node-law variants, fixed eta]
    epistemic_status: OPEN_WITH_PRECISE_BOUNDARY
    novelty_status: NOVELTY_NOT_ESTABLISHED
  - id: THM_V5_K2_M17_CONTRACTIVE_GATED_REPEATED_EXACT
    title: Exact k=2 constant for the contractive gated-planar repeated-law subclass
    statement: >-
      For the repeated law mu_A(x,y)=A*x*<e0,y>, with A supported on the
      active plane, ||A||<=M, ||(I-P)A P||<=rho=eta*M, unit e0 leaves, and an
      orthogonal projector containing e0, the normalized projected-root
      constant is exactly 1 for 0<eta<=1. The exact error identity is
      P*A*(I-P)*A*e0, and A=[[0,M],[rho,0]] attains M*rho.
    scope:
      - finite-dimensional real Hilbert spaces
      - binary k=2 chain with one repeated gated law
      - active planar contraction and fixed e0 gate
      - orthogonal projector with e0 in its range
      - unit leaves e0 and 0 < eta <= 1
    dependencies:
      - THM_V3_PROJECTED_ROOT_K_MINUS_ONE
      - THM_V5_K2_SAME_LAW_PROJECTED_SHARPNESS
    proof_location: research/math_closure/k2/m17_broader_gated_contraction_exact.tex
    implementation: research/math_closure/k2/m17_broader_gated_contraction_exact.py
    tests: [tests/math_closure/test_m17_broader_gated_contraction_exact.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: EXACT_FOR_DECLARED_CONTRACTIVE_GATED_SUBCLASS
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
  - id: THM_V5_K2_SAME_LAW_PROJECTED_SHARPNESS
    title: Exact k=2 projected-root sharpness for an explicitly repeated bilinear law
    statement: >-
      For the real binary k=2 chain with one bilinear law reused at both
      internal nodes, an orthogonal rank-one projector, unit leaves, uniform
      operator norm M, and rho=eta*M in (0,1], the explicitly declared same-law
      class has C_2^P(eta)=1. The map mu(x,y)=M*x1*y0*e0+rho*x0*y0*e1 attains
      E_proj=rho*M.
    scope:
      - finite-dimensional real Hilbert spaces
      - binary chain with one repeated bilinear law
      - orthogonal rank-one projector
      - unit leaf norms
      - 0 < eta <= 1
    dependencies:
