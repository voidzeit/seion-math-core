  - id: THM_V5_FINITE_SOURCE_RESOLVED_ERROR_CALCULUS
    title: Finite source-resolved error calculus for projected multilinear DAGs
    statement: >-
      For every finite typed acyclic graph of finite-dimensional multilinear
      laws with finitely many labelled local sources, each recursively
      projected node error is an exact finite vector-valued polynomial indexed
      by source multiplicities. Topological coefficient convolution agrees
      with recursive unrolling; first-order coefficients aggregate same-source
      paths before taking norms; finite truncation has the omitted-term norm
      bound; and finite signed compositional expressions satisfy
      B_actual <= B_signed <= B_treewise after coefficient-wise aggregation.
    scope:
      - finite-dimensional typed multilinear DAGs
      - finite acyclic graph and finite source support
      - recursively projected baselines with orthogonal output projectors
      - finite signed compositional expressions over the resulting polynomials
