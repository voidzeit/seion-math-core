  - id: THM_V5_HOMOGENEOUS_GATED_ROTATION_ALL_BINARY_TOPOLOGIES
    title: Exact formula for the homogeneous gated-rotation family on every finite ordered full-binary topology
    statement: >-
      For every finite ordered full-binary tree with k internal nodes, the
      declared homogeneous gated-planar rotation law and unit reduced leaves
      have projected-root error
      |a(T)cos(d(T)theta)-cos(theta)^k| in the M=L=1 normalization, where
      d(leaf)=0, d((A,B))=1+d(A), a(leaf)=1, and
      a((A,B))=a(A)a(B)cos(d(B)theta). The result is independent of finite
      ambient dimension and coordinate-projector rank under the stated active
      two-plane assumptions.
    scope:
      - finite-dimensional real Hilbert spaces
      - every finite ordered full-binary topology
      - homogeneous gated-planar rotation law
      - unit leaves and coordinate orthogonal projector
      - 0 <= eta <= 1
    dependencies:
      - THM_V3_ROOT_ERROR_ORTHOGONALITY
    proof_location: research/math_closure/k3/gated_rotation_full_binary.tex
    implementation: research/math_closure/k3/gated_rotation_full_binary.py
    tests: [tests/math_closure/test_gated_rotation_full_binary.py]
    epistemic_status: PROVED_UNDER_ASSUMPTIONS
    sharpness_status: EXACT_RESTRICTED_FAMILY_NOT_GLOBAL_EXTREMAL_CONSTANT
    novelty_status: NOVELTY_NOT_ESTABLISHED
    approval_status: PENDING_HUMAN_REVIEW
