  - id: OPEN_V5_DIMENSION_RANK_REDUCTION
    title: Universal dimension/rank reduction for projected sharpness
    statement: >-
      Fixed-tree support compression proves a finite dimension/rank reduction
      for every fixed finite typed tree, with an explicit bound depending only
      on its leaf and node counts. A certified independent-law growing-chain
      obstruction shows that no nodewise value-preserving bound can be uniform
      over unbounded tree size. Root-only reductions that change intermediate
      laws, same-law restrictions, and extensions beyond the repository's
      type-indexed-projector convention remain open.
