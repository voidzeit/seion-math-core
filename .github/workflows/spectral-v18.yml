name: spectral-v18-cpu
on:
  push:
  pull_request:
jobs:
  spectral-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[research,test]
      - run: python -m pytest -q spectral/certification_v18/tests
