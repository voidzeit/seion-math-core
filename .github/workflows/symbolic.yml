name: symbolic-cpu
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  symbolic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/symbolic

