# Status registry for the math_closure campaign (mission Section IV).
# Allowed statuses: PROVED, DISPROVED_BY_COUNTEREXAMPLE,
# CLASSIFIED_UNDER_EXPLICIT_ASSUMPTIONS, OPEN_WITH_PRECISE_BOUNDARY.
# One entry per mathematical question actually closed or classified this
# campaign. Updated incrementally as M1-M7 are worked; do not remove prior
# entries when adding new ones.

version: 1

entries:
  - id: M1_gji_six_term_general
    question: >
      Does named_gji_variants / ternary_declared_gji (six-term signed
      combination of ternary insertion trees) vanish identically for every
      multilinear mu: V^3 -> V and every 5 (possibly non-collinear) input
      vectors?
    status: DISPROVED_BY_COUNTEREXAMPLE
    evidence:
      - research/math_closure/gji/exact_proof_or_counterexample.tex
      - research/math_closure/gji/mutation_test_report.json (exact_rational_counterexample)
    supersedes: >
      docs/research/signed_forest_terminal_status_v5.md's
      NOT_CERTIFIABLE_AS_DEFINED verdict for named_gji_variants.

  - id: M1_gji_six_term_collinear_subcase
    question: >
      Does the same six-term expression vanish for every multilinear mu
      whenever all 5 leaves are collinear (L_i = c_i * q for a single
      shared vector q)?
    status: PROVED
    admissible_class: >
      any finite-dimensional real or complex V, any multilinear
      mu: V^3 -> V (no symmetry/associativity assumed), leaves constrained
      to a common 1-dimensional subspace.
    evidence:
      - research/math_closure/gji/exact_proof_or_counterexample.tex (Result B)
      - research/math_closure/gji/mutation_test_report.json (collinear_leaves_sub_identity)
    note: >
      This is exactly the regime the prior session's 4000-trial adversarial
      search exercised (rank-1 projector forces collinear leaves), which
      explains that finding without supporting the general claim above.

  - id: M2_k2_class_A_general
    question: >
      For k=2, any bounded multilinear law/topology/dimension/rank/leaf
      norm (field R), what is C_T^proj(eta; A)?
    status: PROVED_UNDER_ASSUMPTIONS
    admissible_class: research/math_closure/k2/admissible_classes.tex (Class A)
    evidence:
      - research/math_closure/k2/classification_theorem.tex
      - research/math_closure/k2/class_A_exact_constant.tex
      - research/math_closure/k2/class_A_exact_constant.py
      - tests/math_closure/test_class_a_exact_constant.py
    result: >
      In the declared finite-dimensional real binary-chain class, the
      normalized constant is exactly C_T^proj(eta; A)=1 for 0<eta<=1.
      The universal k-1 upper bound supplies C<=1 and the embedded repeated-law
      rank-two witness supplies C>=1, so the class-level supremum is closed.
    boundary: >
      Higher-arity k=2 topologies, infinite-dimensional attainment, and
      broader gated-planar subclasses are outside this declared class.

  - id: M2_k2_class_B_chain_gated_rotation
    question: >
      For the homogeneous k=2 chain with the gated-planar-rotation law
      (unit leaves, any dimension n>=2, rank 1<=r<=n-1), what is the
      exact projected error as a function of eta?
    status: PROVED
    admissible_class: research/math_closure/k2/admissible_classes.tex (Class B)
    evidence:
      - research/math_closure/k2/classification_theorem.tex
      - research/math_closure/k2/exact_examples/chain_gated_rotation_eta_squared.py
    result: "E_T^proj(eta) = eta^2 exactly, for all eta in [0,1], independent of n and r."
    corollary: >
      Saturates the universal (k-1)=1 bound iff eta=1; explains (does not
      merely restate) the atlas's 6 exact-match rows.

  - id: M17_k2_contractive_gated_repeated_exact
    question: >
      What is the fixed-eta projected-root constant for the explicitly defined
      repeated gated law mu_A(x,y)=A*x*<e0,y> when A is a planar contraction
      with ||A||<=M and ||(I-P)A P||<=rho?
    status: PROVED_UNDER_ASSUMPTIONS
    admissible_class: >
      finite-dimensional real binary k=2 chain, unit e0 leaves, orthogonal
      projector containing e0, fixed e0 gate, repeated planar contraction A,
      and 0<eta=rho/M<=1.
    evidence:
      - research/math_closure/k2/m17_broader_gated_contraction_exact.tex
      - research/math_closure/k2/m17_broader_gated_contraction_exact.py
      - tests/math_closure/test_m17_broader_gated_contraction_exact.py
    result: >
      The exact error is ||P A (I-P) A e0|| and the normalized class-level
      constant is 1. The off-diagonal contraction A=[[0,M],[rho,0]] attains
      the upper bound M*rho, so orthogonality of the narrower rotation—not
      repeated-law sharing—is the source of its eta^2 value.
    boundary: >
      Variable gates, arbitrary leaf directions, non-planar shared laws, and
      other undefined meanings of broader gated-planar remain open.

  - id: M3_k3_chain_gated_rotation
    question: >
      For the k=3 chain topology, homogeneous gated-planar-rotation law
      (unit leaves, dimension 2, rank 1), what is the exact projected
      error and the best achievable ratio to the universal (k-1)=2 bound?
    status: PROVED
    evidence:
      - research/math_closure/k3/topology_chain.tex
      - research/math_closure/k3/certificates/chain_and_branching_closed_forms.py
    result: "E_T^proj(eta) = 3*eta^2*sqrt(1-eta^2); best ratio 3/4 at eta*=1/sqrt(2); never saturates."
    corrects: >
      docs/research/track_t_v5_terminal_status_k2_k3.md's discretely-sampled
      min relative gap of 0.350 (at eta=0.5) - true continuous minimum gap
      is 1/4, at eta*=1/sqrt(2), a point the sampled grid never tested.

  - id: M3_k3_branching_gated_rotation
    question: >
      Same question as above for the k=3 branching topology (u1,u2 -> root).
    status: PROVED
    evidence:
      - research/math_closure/k3/topology_branching.tex
      - research/math_closure/k3/certificates/chain_and_branching_closed_forms.py
    result: "E_T^proj(eta) = eta^2*sqrt(1-eta^2); best ratio 1/4 at eta*=1/sqrt(2); never saturates."
    note: "Exactly 3x less efficient than chain at the shared optimal eta - topology-dependence now exact, not qualitative."

  - id: M3_k3_general_class_A
    question: >
      For k=3, beyond the independently optimized binary chain and branching
      classes already closed by M14 and M15, what is the extremal constant for
      the remaining arbitrary-law, same-law, higher-arity, or broader-topology
      classes?
    status: OPEN_WITH_PRECISE_BOUNDARY
    boundary: >
      The universal bound remains 0 <= C_T^proj(eta) <= 2*eta*M*L_T for the
      declared k=3 projected-root setting. M20 closes every finite-arity
      independent-law profile, and M21 closes the tagged same-law binary
      subclass. Rank-one/common-leaf same-law, gated subclasses, and broader
      restrictions remain outside these declarations.

  - id: M3b_gated_rotation_left_comb_general_k
    question: >
      For the declared homogeneous gated-planar rotation law and a left-comb
      binary chain with k internal nodes, what is the exact projected error?
    status: PROVED_UNDER_ASSUMPTIONS
    evidence:
      - research/math_closure/k3/gated_rotation_chain_general.tex
      - research/math_closure/k3/gated_rotation_chain_general.py
      - tests/math_closure/test_gated_rotation_chain_general.py
    result: >
      In the M=L=1 normalization, E_proj = |T_k(c)-c^k| with
      c=sqrt(1-eta^2); for general M the value is multiplied by M^k.
      The result is restricted to this law and left-comb topology and does
      not determine the global extremal constant.

  - id: M3c_gated_rotation_all_ordered_full_binary
    question: >
      For every finite ordered full-binary topology under the declared
      homogeneous gated-planar rotation law, what is the exact projected
      error?
    status: PROVED_UNDER_ASSUMPTIONS
    evidence:
      - research/math_closure/k3/gated_rotation_full_binary.tex
      - research/math_closure/k3/gated_rotation_full_binary.py
      - tests/math_closure/test_gated_rotation_full_binary.py
    result: >
      With d(leaf)=0, d((A,B))=1+d(A), a(leaf)=1, and
      a((A,B))=a(A)a(B)cos(d(B)theta), E_proj equals
      |a(T)cos(d(T)theta)-cos(theta)^k| in the M=L=1 normalization,
      independently of finite dimension and coordinate-projector rank.
    note: >
      This closes the whole declared homogeneous gated-rotation family, not
      the global independent-law or arbitrary-law extremal problem.

  - id: M3d_gated_rotation_general_arity
    question: >
      For every finite ordered rooted tree with arity at least two under the
      arity-compatible homogeneous gated-planar rotation law, what is the exact
      projected error?
    status: PROVED_UNDER_ASSUMPTIONS
    evidence:
      - research/math_closure/k3/gated_rotation_general_arity.tex
      - research/math_closure/k3/gated_rotation_general_arity.py
      - tests/math_closure/test_gated_rotation_general_arity.py
    result: >
      With d(leaf)=0, d((T1,...,Tm))=1+d(T1), a(leaf)=1, and
      a((T1,...,Tm))=a(T1) product_{j>=2} a(Tj)cos(d(Tj)theta),
      E_proj=|a(T)cos(d(T)theta)-cos(theta)^k| in the M=L=1 normalization,
      independently of finite dimension and coordinate-projector rank.
    note: >
      Arity-compatible means every arity uses the same active rotation and
      the product of secondary e0 gates; arbitrary laws remain open.

  - id: M11_k3_conditional_quantitative_gap
    question: >
      For the ordered k=3 chain, what quantitative improvement follows if the
      first propagated-defect direction saturates the next-node operator norm?
    status: PROVED_UNDER_ASSUMPTIONS
    evidence:
      - research/math_closure/k3/m11_conditional_quantitative_gap.tex
      - research/math_closure/k3/m11_conditional_quantitative_gap.py
      - tests/math_closure/test_m11_conditional_quantitative_gap.py
    result: >
      The normalized bound is sqrt(4-3*eta^2) for eta<=sqrt(2/3), and
      2/(sqrt(3)*eta) thereafter, relative to rho*M^2*L_T.
    note: >
      This is conditional on exact first-propagator saturation and does not
      close the unrestricted fixed-eta supremum.

  - id: M4_signed_identities_jacobiator_structured_law
    question: >
      Under the structured gated-planar-rotation law (as used for k2/k3),
      what is the binary Jacobiator's triangle-inequality discrepancy?
    status: PROVED
    result: "Exactly 0 for every eta in [0,1] - a fact about this specific law, not the general extremal question."
    evidence:
      - research/math_closure/signed_identities/structured_gated_rotation_jacobiator.tex
      - research/math_closure/signed_identities/structured_gated_rotation_jacobiator.py
      - tests/math_closure/test_structured_gated_rotation_jacobiator.py

  - id: M4_signed_identities_general_extremal_constants
    question: >
      For associator, Filippov, and GJI families under arbitrary generic
      bounded multilinear laws, what are the exact extremal
      (triangle-bound-saturating) constants?
    status: OPEN_WITH_CERTIFIED_GAP
    evidence:
      - research/math_closure/signed_identities/constants_table.csv
      - research/math_closure/signed_identities/proofs.tex
    note: >
      Jacobiator empirically near-sharp (99.43%, not exact); associator
      68.6%/82.9%; Filippov 41.6% (widest gap); GJI general case has no
      adversarial search at all (distinct gap from the other three, see
      constants_table.csv note column).

  - id: M5_fixed_tree_continuum_convergence
    question: >
      For a FIXED finite typed tree T (topology, laws, types independent
      of N), do discretized ambient/reduced evaluations converge to their
      continuum counterparts as the discretization refines, and does the
      (k-1) projected-error bound pass to the limit?
    status: PROVED_UNDER_STATED_ASSUMPTIONS
    admissible_class: >
      Fixed finite tree T (k, depth, topology independent of N); H1-H4 as
      stated in research/math_closure/continuum/assumptions_table.md.
    evidence:
      - research/math_closure/continuum/fixed_tree_convergence.tex
      - research/math_closure/continuum/assumptions_table.md
    method: >
      Direct extension of the already-proved fixed-N (k-1) theorem's own
      multilinear-telescoping induction (docs/theorems_v3/homogeneous_constants.md),
      with a convergence term added at each step; the induction closes in
      exactly k (N-independent) steps because the tree is fixed.
    explicitly_out_of_scope: >
      Growing tree size (k=k_N -> infinity) - documented as unsound without
      additional summability hypotheses in
      research/math_closure/continuum/counterexamples_without_uniformity.tex,
      per the mission's own explicit warning against unconditional
      growing-tree claims.

  - id: M5b_growing_tree_weighted_summability
    question: >
      Which additional condition suffices to pass projected-tree convergence
      to a sequence of trees whose number of internal vertices grows with N?
    status: PROVED_UNDER_STATED_ASSUMPTIONS
    admissible_class: >
      finite typed projected trees T_N with nodewise defects delta_{v,N},
      downstream gains w_{v,N}, and a proved telescoping estimate bounded by
      sum_v w_{v,N} delta_{v,N}; the weighted sum tends to zero.
    evidence:
      - research/math_closure/continuum/growing_tree_summability.tex
      - research/math_closure/continuum/counterexamples_without_uniformity.tex
    result: >
      If the complete downstream-gain-weighted defect sum tends to zero, then
      ambient and recursively projected root evaluations converge and every
      finite-N projected-root bound passes to the limsup. No uniform bound on
      the number of vertices is needed once the weighted sum is controlled.
    limitation: >
      Pointwise fixed-vertex consistency alone is insufficient; this theorem
      does not prove unrestricted growing-tree convergence.

  - id: M6_verified_markov_construction
    question: >
      Does the mission's symmetrized quadratic weight W_kappa (measurability,
      symmetry, nonnegativity, 0<d(p)<infinity a.e., P a contraction,
      self-adjoint, Dirichlet-form identity) admit a verified instance
      under explicit assumptions?
    status: PROVED_UNDER_STATED_ASSUMPTIONS
    admissible_class: >
      kappa jointly measurable, kappa in L^2(X^4, nu^{tensor 4}) (K1);
      d(p):=integral W_kappa(p,s)dnu(s) satisfies 0<d(p)<infinity a.e. (K2,
      not automatic from K1, checked per instance).
    evidence:
      - research/math_closure/markov/verified_class_or_failure_report.tex
      - research/math_closure/markov/examples/finite_sinusoidal_kernel.py
      - research/math_closure/markov/tests/test_verified_markov_construction.py
    example: >
      Finite X={1..6}, kappa(p;q,r,s)=sin(2pi(p+q+r+s)/n)+2 (bounded,
      strictly positive, non-separable). All properties verified exactly
      (symmetry to machine precision, d(p)>0, self-adjoint, largest
      eigenvalue exactly 1 others <1, Dirichlet identity holds to 1e-12).

  - id: M8_k2_saturation_iff_characterization
    question: >
      For the binary k=2 chain (arbitrary finite dimension, arbitrary
      projector rank, laws independent or repeated), what are the necessary
      and sufficient conditions on a configuration for it to saturate the
      universal E_proj <= rho*M*L_T bound exactly?
    status: PROVED
    admissible_class: >
      finite-dimensional real (or complex) binary k=2 chain, arbitrary
      ambient dimension and orthogonal-projector rank, bilinear laws bounded
      by M with closure-residual bounded by rho, mu_in and mu_out may be
      independent or identical.
    evidence:
      - research/math_closure/k2/saturation_iff_theorem.tex
      - src/seion_core/research_v5/k2_characterization.py
      - tests/research_v5_test_k2_characterization.py
    result: >
      E_proj=rho*M*L_T iff EQ1 (outer law saturates M on (D,d)), EQ2
      (closure map saturates rho on (a,b)), and EQ3 (root projection loses
      nothing on mu_out(D,d)) hold simultaneously, where D=(I-P)mu_in(a,b).
      Proved by an elementary chain-of-inequalities argument (equality of
      endpoints forces equality of every intermediate link). Both known
      k=2 witnesses (independent-law, repeated-law) verified as instances;
      a third, independently constructed instance (dim 3, mixed projector
      ranks, not matching either prior witness) verified to saturate,
      exercising sufficiency predictively.
    corrects: >
      src/seion_core/research_v5/equality_conditions.py's K2-EQ-05 was
      stale (marked OPEN_IF_REPEATED after the repeated-law witness had
      already resolved it); fixed alongside this theorem.
    note: >
      Explains, not merely re-verifies, why weight-sharing does not by
      itself destroy sharpness (a single bilinear law can have distinct
      norm-attaining input pairs for its structurally different terms).
      Does not extend to restricted subclasses (e.g. gated-planar rotation,
      where EQ1-EQ3 are demonstrably incompatible at the required strength)
      or to k>=3 (the two-node telescoping argument does not extend
      mechanically; see M9).

  - id: M9_k3_general_upper_envelope
    question: >
      For the independent-law k=3 chain and branching topologies (arbitrary
      finite dimension, arbitrary projector rank, no rank-one restriction),
      can the trivial universal upper bound C_3,ind^P(eta)<=2 be tightened
      unconditionally (i.e. without the previously flagged, unproved, and
      dimensionally inconsistent scalar-reduction assumption)?
    status: PROVED
    admissible_class: >
      finite-dimensional real (or complex) binary k=3 chain and branching
      trees, arbitrary ambient dimension and orthogonal-projector rank,
      bilinear laws bounded by M with each node's own closure-residual
      bounded by rho.
    evidence:
      - research/math_closure/k3/general_upper_envelope.tex
      - src/seion_core/research_v5/k3_upper_bound.py
      - tests/research_v5_test_k3_upper_bound.py
      - scripts/verify_k3_bound.py (42-trial numerical corroboration, weak/non-adversarial)
    result: >
      C_3,ind^P(eta) <= U_3(eta) = 1+sqrt(1-eta^2) for 0<eta<=eta_star,
      sqrt(1+eta^2)/eta for eta_star<eta<=1, eta_star=sqrt((sqrt5-1)/2)
      (~0.786151, where both branches equal the golden ratio phi exactly).
      U_3(eta)<2 strictly for every eta>0; U_3(1)=sqrt(2)~=1.41421, a 29%
      reduction from the trivial bound 2. Derived via exact local-error
      telescoping plus a Pythagorean coupling (R_1 perp D_1 under the
      orthogonal projector at the first internal node) between the two
      propagated-error terms; identical for chain and branching (this
      bound does not distinguish topology, unlike the restricted
      gated-planar family, M3).
    supersedes: >
      v5b_extremal.py's conditional_scalar_reduction_upper_bound /
      CONDITIONAL_ON_UNPROVED_SCALAR_REDUCTION bookkeeping entry, whose
      stated assumptions (E_proj<=2*A*B, A^2+B^2<=M^2) were never proved
      and are dimensionally inconsistent with the actual witness value
      2*M*q*sqrt(M^2-q^2) (missing a factor of M). That entry is now
      historical; this theorem is the correct, proved replacement.
    remaining_gap: >
      Does NOT close fixed-eta sharpness: L_3(eta) (V5-A/V5-B certified
      lower witness) < U_3(eta) for every eta in (0,1) tested. Gap
      narrowed substantially (e.g. at eta=1, relative gap 50%->29%; at
      eta=0.9, ~44%->26%) but OPEN_WITH_CERTIFIED_GAP remains the correct
      terminal status for fixed-eta k=3 sharpness.

  - id: M10_k3_upper_envelope_not_attained
    question: >
      Can M9's upper envelope U_3(eta) be exactly attained by some
      admissible independent-law ordered k=3 chain configuration, i.e.
      are all inequalities in the M9 derivation simultaneously tight?
    status: PROVED_NON_ATTAINMENT
    revision_note: >
      This entry was revised after review found two errors in the first
      version: (1) the original proof claimed S1 perp S2 (node 2),
      derived incorrectly from "S1 perp B" surviving an arbitrary
      projection Q=I-P2, which does not follow in general; repaired with
      a projector-independent self-adjointness/contradiction argument
      giving the weaker but sufficient fact "S2 is never a nonzero
      multiple of S1". (2) the original conclusion claimed the STRICT
      SUPREMUM inequality C_3,ind^P(eta) < U_3(eta) from a NON-ATTAINMENT
      fact alone -- these are logically different (a supremum can be
      approached without being attained), so the strict inequality is
      NOT established and status is downgraded from PROVED to
      PROVED_NON_ATTAINMENT accordingly. See
      research/projected_trees_v5/V5_CLOSURE_REPORT.md for the full
      record of both corrections.
    admissible_class: >
      same finite-dimensional real (or complex) binary k=3 chain class as
      M9, arbitrary dimension/rank.
    evidence:
      - research/math_closure/k3/m10_non_sharpness_of_m9.tex
      - src/seion_core/research_v5/k3_non_sharpness.py
      - tests/research_v5_test_k3_non_sharpness.py
    result: >
      No single admissible chain configuration attains
      E_proj=U_3(eta)*rho*M^2*L_T exactly. Repaired argument: (Step 1, node 2) if T1 saturates exactly,
      the base lemma gives S1 perp B where B:=mu2(R1,c) is the unprojected
      precursor; a self-adjointness argument (Q=I-P2 self-adjoint for ANY
      orthogonal projector) then shows S2:=Q@B can never be a nonzero
      scalar multiple of S1, without assuming any specific P2. (Step 2,
      node 3) decomposing S2=alpha*S1+beta*w (w perp S1, beta!=0 by Step
      1), the base lemma gives N3(w) perp N3(S1) when T1 also saturates at
      the root; requiring BOTH triangle-parallelism (needs beta*N3(w)=0)
      AND T2 exact saturation at the root (needs beta=0 even if N3(w)=0,
      by a direct norm computation) forces beta=0, contradicting Step 1
      either way.
    NOT_established: >
      C_3,ind,chain^P(eta) < U_3(eta) as a strict SUPREMUM inequality is NOT
      proved by M10 alone (this was the second error in the original
      version). Non-attainment at every point does not by itself rule out
      the supremum equalling U_3(eta), approached but never reached by
      any single configuration (cf. sup_{0<x<1} x = 1). Closing this needs
      M14 now supplies the exact chain value and strict gap; branching is
      handled independently by M15. Either a compactness argument (Route A, restricting to a class where
      the extremal problem is known to live on a compact set -- itself
      blocked on the still-open dimension/rank reduction result) or an
      explicit quantitative gap E_proj <= U_3(eta)-delta(eta), delta>0
      (Route B, unconditional, the stronger and more valuable route).
      Recorded as a new, precisely-scoped open item, not conflated with
      the proved non-attainment result above.
    remaining_gap: >
      Proves chain non-attainment only, does NOT by itself produce an exact
      tightened value or a proved strict gap. M14 now closes the chain. The natural next step -- a joint
      optimization over the magnitude allocation q and the angle phi
      between S1,S2 -- was set up (pareto_frontier_two_direction_norm_
      budget quantifies how the jointly-supportable magnitude pair
      shrinks as phi->0) but not solved this session. A separate
      gradient-based numerical search (m10_k3_search.py, not committed)
      failed to even recover the already-known L_3(eta) lower witness and
      is explicitly flagged as an unreliable, discarded attempt, not
      evidence of anything.

  - id: M10b_k3_fixed_class_compactness_gap
    question: >
      Does M10 non-attainment imply a strict supremum gap after fixing all
      finite dimensions and projector ranks?
    status: PROVED_UNDER_STATED_ASSUMPTIONS
    admissible_class: >
      finite-dimensional real or complex binary k=3 chain or branching
      topology, fixed type dimensions, fixed orthogonal-projector ranks,
      independent laws, and 0<eta<1.
    evidence:
      - research/math_closure/k3/fixed_dimension_compactness_gap.tex
      - research/math_closure/k3/m10_non_sharpness_of_m9.tex
      - claims/theorem_registry_v5.yaml
    result: >
      The finite tensor, fixed-rank projector, and unit-leaf parameter spaces
      are compact and the constraints and projected error are continuous.
      Since M10 excludes attainment of U_3 for the chain, and M15 gives
      W_3<U_3 for branching, the fixed-class maximum lies strictly below U_3
      by a positive class-dependent delta_{n,r}(eta).
    limitation: >
      No dimension/rank-uniform delta is obtained; the global supremum over
      unbounded dimensions or ranks may still equal U_3 as a limit within the
      scope of M10b alone; M10c resolves this for the fixed k=3 topologies.
    superseded_by: M10c_fixed_tree_support_compression_and_global_gap

  - id: M10c_fixed_tree_support_compression_and_global_gap
    question: >
      Can the fixed-tree dimension/rank reduction be made uniform for the
      k=3 chain and branching classes, thereby closing the global strict gap?
    status: PROVED_UNDER_ASSUMPTIONS
    admissible_class: >
      fixed finite typed trees under the repository's type-indexed orthogonal
      projector convention; independent-law binary k=3 chain or branching for
      the global corollary.
    evidence:
      - research/math_closure/dimension_rank/fixed_tree_support_compression.tex
      - research/math_closure/dimension_rank/fixed_tree_support_compression.py
      - tests/math_closure/test_fixed_tree_support_compression.py
      - research/math_closure/k3/m10_non_sharpness_of_m9.tex
    result: >
      Every fixed finite typed tree compresses to dimension at most
      2*(leaf_count+2*node_count) per type without changing errors or
      increasing norm caps. For k=3 one-type binary chain/branching this is
      20 (or 22 with proper-projector padding). Compactness plus M10 yields
      the chain gap, while M15 yields the branching gap; M14/M15 now give the
      exact constants W_3 for both topologies.
    limitation: >
      The exact finite-topology constants are closed for independent laws;
      same-law/gated sharpness and one dimension bound uniform over unbounded
      tree size/arity remain open.

