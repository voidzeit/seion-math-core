experiment_id: TTN_FB15K237_SCORE_SPACE_SPECTRUM_2026-08-09
status: observed
dataset: FB15K-237
checkpoint: runs/TTN_FB15K237_TTN_V2_D128_E10_2026-08-09/full_ttn.pt
scope:
  relations: original_237_only
  fitting_split: train
  score_matrix: implicit_Z_times_entity_embeddings_transpose
  objective: relationwise_frobenius_score_residual
