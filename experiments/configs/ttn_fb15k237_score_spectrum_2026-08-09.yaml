  manifest: runs/TTN_FB15K237_TTN_V2_D128_E10_2026-08-09/score_spectrum_relationwise_manifest.json
limitations:
  - This is an exact Frobenius oracle for sampled train query rows and stored entity embeddings.
  - It is not a ranking certificate and does not establish held-out or universal error control.
  - The checkpoint is exploratory: post-training evaluation was paused after checkpoint creation.
