version: 2
title: "Structure-preserving reduction v2 evidence matrix"
policy:
  principal_seed_count: 5
  historical_runs_are_not_replicates: true
  exact_examples_use_rational_coefficients: true
  every_run_records:
    - source_commit
    - implementation_version
    - resolved_config_hash
    - mathematical_object_hash
    - input_artifact_hash
    - seed
    - precision
    - backend
    - device
experiments:
  - id: V2_APPROX_CLOSURE_BOUND
    purpose: "Observed tree error versus explicit k*rho*M^(k-1) certificate"
    arity: 3
    ambient_dimension: 4
    reduced_rank: 2
    epsilons: [0.0, 0.01, 0.05, 0.1]
    tree_families: [single, associator_left, balanced]
    seeds: [0, 1, 2, 3, 4]
  - id: V2_PROJECTOR_RECOVERY
    purpose: "Known, random, PCA, SVD, spectral, and closure-minimizing controls"
    arity: 3
    ambient_dimension: 4
    reduced_rank: 2
    leakage: 0.02
    methods: [known_invariant, random, pca, svd, spectral, closure_minimizing]
    seeds: [0, 1, 2, 3, 4]
  - id: V2_CP_RANK_SWEEP
    purpose: "Dense baseline and CP rank/error/runtime trade-off"
    arity: 3
    ambient_dimension: 3
    ranks: [1, 2, 3]
    seeds: [0, 1, 2, 3, 4]
  - id: V2_SPECTRAL_GAP
    purpose: "Positive-gap snapping stability and no-gap rank-flip control"
    dimensions: [4]
    gaps: [0.5, 0.2, 0.1, 0.05]
    relative_perturbations: [0.01, 0.1, 0.4]
    seeds: [0, 1, 2, 3, 4]
  - id: V2_CPU_GPU_PARITY
    purpose: "Independent CPU/GPU contraction parity when CUDA is available"
    arity: 3
    ambient_dimension: 6
    seeds: [0, 1, 2, 3, 4]
