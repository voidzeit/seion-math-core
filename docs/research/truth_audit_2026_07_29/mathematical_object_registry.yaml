# Independent, advisory object registry — 2026-07-29.
# Lists objects that exist as code in src/seion_core, tagged by the
# mission's section-1 taxonomy. `audit_coverage: verified` means this pass
# read the module, its registry entry (if any), and its test, and confirms
# the epistemic_status below. `audit_coverage: not_reviewed` means the
# module was located but not independently checked in this pass — its
# status field is a placeholder ("code exists, theorem backing unverified")
# and must not be read as a positive claim.
#
# This file does not replace claims/theorem_registry_v3.yaml or
# claims/scope_registry_v4.yaml, which remain the canonical sources.

